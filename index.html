<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta lang="es">
    <title>Ejemplo registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form class="form">
            <h1>Crear cuenta</h1>
            <div class="fila">
                <input placeholder="Nombre" class="campo" required>
                <input placeholder="Apellidos" class="campo" required>
            </div>
            <input type="email" placeholder="Correo electrónico" class="campo" required>
            <input type="password" placeholder="Contraseña" class="campo" required>
            <input type="password" placeholder="Confirmar contraseña" class="campo" required>
            <input type="submit" class="enviar" value="Crear cuenta">
            <div class="divisor"></div>
            <a href="">Iniciar sesion</a>
        </form>
    </main>
</body>
</html>
