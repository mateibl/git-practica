<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Ejemplo registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form class="form" method="post">
            <h1>Crear cuenta</h1>
            <div class="fila">
                <div class="contenedorLabel">
                    <label>Nombre:
                        <input class="campo" autocomplete="given-name" required name="first_name">
                    </label>
                </div>
                <div class="contenedorLabel">
                    <label>Apellidos:
                        <input class="campo" autocomplete="family-name" required name="last_name">
                    </label>
                </div>      
            </div>
            <div class="contenedorLabel">
                <label>Correo electrónico:
                    <input type="email" placeholder="ejemplo@gmail.com" class="campo" autocomplete="email" required name="email">
                </label>
            </div>
            <div class="contenedorLabel">
                <label>Contraseña:
                    <input type="password" class="campo" autocomplete="new-password" required name="password">
                </label>
            </div>
            <div class="contenedorlabel">
                <label>Confirmar contraseña:
                    <input type="password" class="campo" autocomplete="new-password" required name="confirm_password">
                </label>
            </div>
            <input type="submit" class="enviar" value="Crear cuenta">
            <div class="divisor"></div>
            <p>¿Ya tienes cuenta? <a href="">Iniciar sesión</a></p>
        </form>
    </main>
</body>
</html>
