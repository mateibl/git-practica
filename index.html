<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Ejemplo registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form class="form" method="post">
            <h1>Crear cuenta</h1>
            <div class="form__row">
                <label>Nombre:
                    <input class="campo" autocomplete="given-name" required name="first_name">
                </label>

                <label>Apellidos:
                    <input class="campo" autocomplete="family-name" required name="last_name">
                </label>   
            </div>
            <label>Correo electrónico:
                <input type="email" placeholder="nombre@example.com" class="campo" autocomplete="email" required name="email">
            </label>
            <label>Contraseña:
                <input type="password" class="campo" autocomplete="new-password" required name="password">
            </label>
            <label>Confirmar contraseña:
                <input type="password" class="campo" autocomplete="new-password" required name="confirm_password">
            </label>
            <input type="submit" class="enviar" value="Crear cuenta">
        </form>
        <p class="textoLogin">¿Ya tienes cuenta? <a class="enlaceLogin" href="login.html">Iniciar sesión</a></p>
    </main>
</body>
</html>
