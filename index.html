<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Ejemplo registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form class="form" method="post">
            <h1 class="form__title">Crear cuenta</h1>
            <div class="form__row">
                <label class="form__label">Nombre:
                    <input class="form__field" autocomplete="given-name" required name="first_name">
                </label>

                <label class="form__label">Apellidos:
                    <input class="form__field" autocomplete="family-name" required name="last_name">
                </label>   
            </div>
            <label class="form__label">Correo electrónico:
                <input type="email" placeholder="nombre@example.com" class="form__field" autocomplete="email" required name="email">
            </label>
            <label class="form__label">Contraseña:
                <input type="password" class="form__field" autocomplete="new-password" required name="password">
            </label>
            <label class="form__label">Confirmar contraseña:
                <input type="password" class="form__field" autocomplete="new-password" required name="confirm_password">
            </label>
            <input type="submit" class="form__submit" value="Crear cuenta">
        </form>
        <p class="account-login">¿Ya tienes cuenta? <a class="account-login__link" href="login.html">Iniciar sesión</a></p>
    </main>
</body>
</html>
