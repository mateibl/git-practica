<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form class="form">
            <h1>Crear cuenta</h1>
            <div class="fila">
                <label>Nombre:<br><input class="campo" required name="first_name"></label>
                <label>Apellidos:<br><input class="campo" required name="last_name"></label>
            </div>
            <label>Correo electrónico:<br><input type="email" placeholder="ejemplo@gmail.com" class="campo" required name="email"></label>
            <label>Contraseña:<br><input type="password" class="campo" required name="password"></label>
            <label>Confirmar contraseña:<br><input type="password" class="campo" required name="confirm_password"></label>
            <input type="submit" class="enviar" value="Crear cuenta" name="submit">
            <div class="divisor"></div>
            <a href="">Iniciar sesion</a>
        </form>
    </main>
</body>
</html>
