<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Ejemplo registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form class="form" method="post">
            <h1 class="form__title">Iniciar sesión</h1>
            <label class="form__label">Correo electrónico:
                <input type="email" placeholder="nombre@example.com" class="form__field" autocomplete="email" required name="email">
            </label>
            <label class="form__label">Contraseña:
                <input type="password" class="form__field" autocomplete="current-password" required name="password">
            </label>
            <input type="submit" class="form__submit" value="Iniciar sesión">
        </form>
        <p class="account-login">¿No tienes cuenta? <a class="account-login__link" href="index.html">Crear cuenta</a></p>
    </main>
</body>
</html>
