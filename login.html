<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Ejemplo registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <form class="form" method="post">
            <h1>Iniciar sesión</h1>
            <div class="contenedorLabel">
                <label>Correo electrónico:
                    <input type="email" placeholder="nombre@example.com" class="campo" autocomplete="email" required name="email">
                </label>
            </div>
            <div class="contenedorLabel">
                <label>Contraseña:
                    <input type="password" class="campo" autocomplete="password" required name="password">
                </label>
            </div>
            <input type="submit" class="enviar" value="Iniciar sesión">
            <div class="divisor"></div>
            <p>¿No tienes cuenta? <a href="index.html">Crear cuenta</a></p>
        </form>
    </main>
</body>
</html>
